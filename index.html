<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SIDEQUEST: An Open-Source AI Outdoor Exploration Game. Receive a real-world investigation powered by local sentence embeddings, put your screen away, explore, and record field notes."
    />
    <meta name="theme-color" content="#163324" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Editorial field-journal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>SIDEQUEST — Open-Source AI Outdoor Exploration Game</title>
  </head>
  <body class="bg-[#FAF7F2] text-[#1C2621]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #FAF7F2; color: #163324; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; padding: 24px;">
          <div style="width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px; background: #163324; display: flex; align-items: center; justify-content: center; color: #C87D32; font-weight: bold; font-size: 20px;">
            🧭
          </div>
          <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #163324;">SIDEQUEST</h2>
          <p style="font-size: 13px; color: #57635C; margin: 0;">Opening field journal...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any stale service workers from localhost development to prevent request hijacking
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    </script>
  </body>
</html>
